# the login faces the internet, this slows down password guessing per address
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;

server {
    listen 80;

    # behind caddy every request comes from one address, the visitor is in the header
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8000/auth/login;
        proxy_set_header Host $host;
    }

    # the trailing slash strips the /api prefix
    location /api/ {
        proxy_pass http://app:8000/;
        proxy_set_header Host $host;
        # photos of a multi-page invoice, the default limit is 1 MB
        client_max_body_size 100m;
        # recognition with long reasoning takes minutes
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
