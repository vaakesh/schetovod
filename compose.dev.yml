services:
  app:
    # the migrations still run only at the start of the container
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # 0 only for plain http
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-1}
    volumes:
      - ./app:/app

  # the same nginx config as in production, only the site comes from Vite
  frontend:
    image: nginx:1.29.0-alpine
    depends_on:
      # nginx resolves the names once, a new container would keep it on the old address
      app:
        condition: service_healthy
        restart: true
      vite:
        condition: service_started
        restart: true
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/nginx.vite.conf:/etc/nginx/frontend.conf:ro

  vite:
    build:
      context: ./frontend
      target: dev
    image: schetovod-vite
    # node_modules of the image stay in place, only the sources come from the host
    volumes:
      - ./frontend/src:/frontend/src

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
