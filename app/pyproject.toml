[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vaakesh", email = "apua.uaua@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-exporter-prometheus>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-logging>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1",
    "reportlab>=5.0.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "taskiq[opentelemetry]>=0.11",
    "taskiq-redis>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.uv]
exclude-newer = "2026-09-30T15:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
