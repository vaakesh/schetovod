{
  "folders": {},
  "connections": {
    "postgres-schetovod": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "schetovod",
      "save-password": true,
      "configuration": {
        "host": "postgres",
        "port": "5432",
        "database": "__POSTGRES_DB__",
        "url": "jdbc:postgresql://postgres:5432/__POSTGRES_DB__",
        "type": "dev",
        "auth-model": "native",
        "user": "__POSTGRES_USER__",
        "password": "__POSTGRES_PASSWORD__"
      }
    }
  }
}
