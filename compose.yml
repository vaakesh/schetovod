x-environment: &environment
  POSTGRES_USER: ${POSTGRES_USER:?Run install.sh}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh}
  POSTGRES_DB: ${POSTGRES_DB:?Run install.sh}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  # the settings are shared with the app, they do not start without it
  JWT_SECRET: ${JWT_SECRET:?Run install.sh}
  # the key of the aQsi cash register, the shifts are loaded with it
  AQSI_API_INTEGRATION: ${AQSI_API_INTEGRATION:-}

x-backend: &backend
  image: schetovod-backend
  # the app service builds the image, it is in no registry
  pull_policy: never
  environment: *environment

services:
  app:
    <<: *backend
    build:
      context: ./app
    environment:
      <<: *environment
      # without it the app works, only the recognition by photo is refused
      OPENAI_API_TOKEN: ${OPENAI_API_TOKEN:-}
    volumes:
      - ./invoices:/invoices
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12

  # one process: every process would load the receipts on its start
  worker:
    <<: *backend
    # the app applies the migrations, two processes must not do it at once
    entrypoint: []
    command: ["taskiq", "worker", "core.broker:broker", "traffic.tasks", "--workers", "1"]
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  # one instance only, a second one would send every task twice
  scheduler:
    <<: *backend
    entrypoint: []
    command: ["taskiq", "scheduler", "core.broker:scheduler", "traffic.tasks"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  # nginx is the entry point: it serves the site and sends /api to the app
  # local only, on the server the system Caddy ends TLS and sends the domain here
  frontend:
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:11300:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run install.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh}
      POSTGRES_DB: ${POSTGRES_DB:?Run install.sh}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.2.2-alpine
    # the queue and the delayed attempts survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
